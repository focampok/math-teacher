name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check studykit tests
      - name: Tests
        env:
          DATABASE_URL: sqlite:///./data/ci.sqlite
          UPLOAD_TOKEN: test-token
          DATA_DIR: ./data
        run: |
          mkdir -p data
          pytest -q
