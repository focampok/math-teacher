[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studykit"
version = "0.1.0"
description = "Compile Markdown or text into a self-contained study kit (practice, formulas, recitation)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Francisco Ocampo", email = "hola@focampo.com" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
studykit-web = "studykit.api.main:run"
studykit-worker = "studykit.worker:run"

[tool.setuptools.packages.find]
include = ["studykit*"]

[tool.setuptools.package-data]
studykit = ["renderer/templates/*.html", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
