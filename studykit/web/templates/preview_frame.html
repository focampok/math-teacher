<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview · {{ kit.title }} — Studykit</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="preview-app">
  <header class="preview-bar">
    <a class="home-btn" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5 12 4l8 7.5"/>
        <path d="M7 10.5V20h10v-9.5"/>
      </svg>
      Inicio
    </a>
    <a class="nav-link" href="/kits/{{ kit.id }}/ui">Volver al kit</a>
    <span class="chip wait">Preview · aún no es el enlace de los alumnos</span>
  </header>
  <iframe
    class="preview-frame"
    title="Preview de {{ kit.title }}"
    src="/ui/preview/{{ kit.id }}/raw?token={{ token }}"
  ></iframe>
</body>
</html>
