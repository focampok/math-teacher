[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'alembic upgrade head && uvicorn studykit.api.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"

# One web service is enough: the API embeds the queue worker (Railway cannot
# share a volume across two services). Attach Postgres + a Volume at /data.
# Set DATABASE_URL, UPLOAD_TOKEN, DATA_DIR=/data, PUBLIC_BASE_URL.
